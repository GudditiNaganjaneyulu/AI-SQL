$schema: https://api.gitbook.com/gitbook-docs.yaml
version: 1
site:
  title: DP-800 AI-Enabled Database Solutions Study Guide
  structure:
    # Stage 0 — orientation: the exam, the roadmap, and tools.
    - type: section
      key: section-start-here
      title: Start Here
      path: start
      description: The DP-800 exam, a 12-week beginner roadmap, and how to set up Azure SQL or SQL Server 2025 and VS Code.
      default: true
      children:
        - type: space
          key: space-start-here
          title: Start Here
          path: welcome
          default: true
          content:
            directory: ./00-start-here

    # Stages 1-3 — prerequisites a beginner needs before the exam domains.
    - type: section
      key: section-learn-the-basics
      title: Learn the Basics
      path: basics
      description: Database foundations, core T-SQL from SELECT to MERGE, and the SQL Server, Azure SQL and Fabric platform family.
      children:
        - type: space
          key: space-foundations
          title: 1. Foundations
          path: foundations
          default: true
          content:
            directory: ./01-foundations
        - type: space
          key: space-core-tsql
          title: 2. Core T-SQL
          path: core-tsql
          content:
            directory: ./02-core-tsql
        - type: space
          key: space-azure-sql-platform
          title: 3. Azure SQL Platform
          path: azure-sql-platform
          content:
            directory: ./03-azure-sql-platform

    # Stages 4-6 — the three official DP-800 skill domains, in exam order.
    - type: section
      key: section-exam-domains
      title: DP-800 Exam Domains
      path: exam-domains
      description: Domain 1 design and develop (35-40%), Domain 2 secure, optimize and deploy (35-40%), Domain 3 AI capabilities (25-30%).
      children:
        - type: space
          key: space-design-and-develop
          title: 4. Design and Develop
          path: design-and-develop
          default: true
          content:
            directory: ./04-design-and-develop
        - type: space
          key: space-secure-optimize-deploy
          title: 5. Secure, Optimize and Deploy
          path: secure-optimize-deploy
          content:
            directory: ./05-secure-optimize-deploy
        - type: space
          key: space-ai-capabilities
          title: 6. AI Capabilities
          path: ai-capabilities
          content:
            directory: ./06-ai-capabilities

    # Stages 7-8 — hands-on practice, then revision and exam preparation.
    - type: section
      key: section-practice-and-revision
      title: Practice and Revision
      path: practice
      description: Nine guided labs with a lab database script, then a cheat sheet, knowledge checks, a 40-question practice exam and a revision checklist.
      children:
        - type: space
          key: space-labs
          title: 7. Hands-on Labs
          path: labs
          default: true
          content:
            directory: ./07-labs
        - type: space
          key: space-revision
          title: 8. Revision and Practice
          path: revision
          content:
            directory: ./08-revision

    - type: external-link
      key: link-dp-800-study-guide
      title: Official DP-800 Study Guide
      description: Microsoft's current skills measured for Exam DP-800, Developing AI-Enabled Database Solutions.
      url: https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/dp-800
